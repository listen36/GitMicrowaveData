[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umbmid-phantom-validation"
version = "1.0.0"
description = "Leakage-controlled, phantom-disjoint validation of physics-guided microwave features on UM-BMID"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Lisen Fang"}]
keywords = ["microwave imaging", "UM-BMID", "phantom", "ROC AUC", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2"
]

[project.optional-dependencies]
deep-learning = ["torch>=2.1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
